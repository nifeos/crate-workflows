# cargo-deny for a standalone nifeos crate: nife's policy without its exceptions. nife skips
# rayon (it is in the kernel's dev graph), ignores an `rsa` advisory (the vendored TLS exercise
# needs it), and allows the vendored tree's licenses. None of that exists here. When this file
# needs an exception, the reason goes beside it, and the supply-chain job shows it on every run.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# The reusable weekly workflow: drift, MSRV, semver, Miri, and the two checks that need no pull
# request (settings drift, stranger cadence). The full mutation run is mutation.yml's.

# The caller's thin workflow carries the schedule (a weekly cron and workflow_dispatch); everything
# here runs the same on a dispatch, so a person can trigger a pass at any time.

name: weekly

on:
  workflow_call:
    inputs:
      manifest-path:
        type: string
        default: Cargo.toml
      targets:
        type: string
        default: ''
      caller-checks:
        description: Run the settings-drift and stranger jobs (off for the template's selftest).
        type: boolean
        default: true
      settings-drift:
        description: Run the settings-drift job, when caller-checks is on. In a repository of several
          crates the drift job reads the repository's settings once, so one call keeps this true.
        type: boolean
        default: true
      stranger-cadence:
        description: Run the stranger-cadence job, when caller-checks is on. Each publishable crate
          keeps its own; the job passes over a member that may not be published.
        type: boolean
        default: true
    secrets:
      SETTINGS_TOKEN:
        description: A fine-grained PAT holding this repository's Administration read-only, for the
          settings-drift reads, plus Contents read and write (GitHub returns the merge settings only to a
          caller with push access). The GITHUB_TOKEN cannot hold the first scope; an organization
          secret named SETTINGS_TOKEN covers every crate repository at once.
        required: false

permissions:
  contents: read

concurrency:
  group: weekly-${{ github.workflow }}-${{ github.ref }}${{ (inputs.manifest-path != 'Cargo.toml' && inputs.manifest-path != './Cargo.toml') && format('-{0}', inputs.manifest-path) || '' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  MANIFEST: ${{ inputs.manifest-path }}
  TARGETS: ${{ inputs.targets }}

jobs:
  lag:
    name: lag (template release)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - run: .crate-workflows/helpers/lag-check.sh
        env:
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # nife's toolchain-drift, minus the nightly pin: the crate builds on stable, so drift is "the
  # newest stable or beta broke us", and red here is the signal a pin bump owes a fix for.
  drift:
    name: drift (newest stable and beta)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - run: |
          set -e
          rustup toolchain install "${{ matrix.channel }}" --profile minimal --component clippy
          for t in $TARGETS; do rustup +"${{ matrix.channel }}" target add "$t"; done
      - run: |
          set -e
          cargo +"${{ matrix.channel }}" build --manifest-path "$MANIFEST"
          cargo +"${{ matrix.channel }}" test --manifest-path "$MANIFEST"
          cargo +"${{ matrix.channel }}" clippy --manifest-path "$MANIFEST" --all-targets -- -D warnings
          for t in $TARGETS; do
            cargo +"${{ matrix.channel }}" build --manifest-path "$MANIFEST" --target "$t"
          done
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  msrv:
    name: msrv (rust-version builds)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - name: build and test at the stated MSRV
        run: |
          set -e
          msrv=$(python3 .crate-workflows/helpers/read_rust_version.py "$MANIFEST")
          if [ -z "$msrv" ]; then
            echo "no rust-version in $MANIFEST; the standalone gate should have refused this"
            exit 1
          fi
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" build --manifest-path "$MANIFEST"
          cargo +"$msrv" test --manifest-path "$MANIFEST"
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # The interface's stability is measured weekly, as a report: a deliberate break between releases
  # waits for its release, so red here would be noise. The per-pull-request semver rule in label.yml
  # is the one that holds a merge.
  semver:
    name: semver (report against the last release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      # Full history and tags: the baseline is the newest release tag, named by revision.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-semver-checks
      - name: cargo-semver-checks against the previous release tag
        run: |
          set -e
          # A member that may not be published, in a repository of several crates, has no release
          # to compare against (helpers/crate_info.py, RELEASE TARGET).
          if [ "$(python3 .crate-workflows/helpers/crate_info.py release-target "$MANIFEST" || true)" = no ]; then
            echo "==> $MANIFEST may not be published; semver has no release to compare against"
            echo "### semver: $MANIFEST may not be published, so there is no release to compare against" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          baseline=$(.crate-workflows/helpers/semver-run.sh "$MANIFEST" semver-report.txt)
          {
            echo "### semver against the last release ($baseline)"
            echo '```'
            python3 .crate-workflows/helpers/semver_major.py semver-report.txt || true
            tail -8 semver.err
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  miri:
    name: miri
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal --component miri
      - run: cargo +nightly miri test --manifest-path "$MANIFEST"
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # A setting changed by hand in the web interface is a red run, not a surprise. The comparison is
  # against the settings file at the pinned template commit, so the drift is always measured
  # against the version of the template the caller actually runs.
  #
  # The reads are repository-administration reads (rulesets, environments), and the GITHUB_TOKEN
  # cannot hold that scope: GitHub's parser refuses `administration` in any `permissions` block.
  # So the check authenticates as the SETTINGS_TOKEN secret instead, a fine-grained personal
  # access token with this repository's Administration read-only, stored once as an organization
  # secret so every crate repository inherits it. Until the secret exists the job is red on its
  # 403 with instructions, which is the check working, not failing.
  settings-drift:
    name: settings drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ inputs.caller-checks && inputs.settings-drift }}
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      # The caller's checkout says how many crates the repository holds, and a repository of
      # several is read back by crate (helpers/settings_members.py).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - run: |
          set -e
          names=$(python3 .crate-workflows/helpers/crate_info.py names "$MANIFEST")
          members=()
          if [ "$(printf '%s\n' "$names" | wc -l)" -gt 1 ]; then
            for n in $names; do members+=(--member "$n"); done
          fi
          .crate-workflows/script/check-settings "${{ github.repository }}" "${members[@]}"
        env:
          GH_TOKEN: ${{ secrets.SETTINGS_TOKEN || github.token }}
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # crates.io and docs.rs answer "not found" for a crate that was never published, so their two
  # badges wait for the first publish (helpers/readme_badges.py --add-published writes them). This
  # job asks crates.io whether the crate exists and fails when the README's badge row disagrees:
  # published without the pair, or the pair without a publish. A failed lookup is a red job, not a
  # guess. It runs here rather than in check because it needs the network.
  crates-io-badges:
    name: crates.io badges
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - run: |
          set -e
          # A crate that may not be published has no crates.io pair to judge.
          if [ "$(python3 .crate-workflows/helpers/crate_info.py published "$MANIFEST" || true)" = no ]; then
            echo "==> $MANIFEST may not be published; no crates.io badges to judge"
            exit 0
          fi
          python3 .crate-workflows/helpers/readme_badges.py --crate-dir "$(dirname "$MANIFEST")" \
            --repository "$GITHUB_REPOSITORY" --published lookup --published-only \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # The release's whole claim is that a stranger can build and prove the crate from its README
  # alone. The run itself needs a person; this job fails when one is overdue, measured from the
  # last recorded run in docs/stranger-test.md.
  stranger:
    name: stranger cadence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ inputs.caller-checks && inputs.stranger-cadence }}
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - run: |
          set -e
          if [ "$(python3 .crate-workflows/helpers/crate_info.py release-target "$MANIFEST" || true)" = no ]; then
            echo "==> $MANIFEST may not be published, and the repository holds other crates: no stranger-test cadence owed"
            exit 0
          fi
          .crate-workflows/script/stranger-due "$(dirname "$MANIFEST")/docs/stranger-test.md"
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

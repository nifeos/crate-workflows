# The reusable weekly workflow: drift, MSRV, semver, Miri, mutation, and the two checks that
# need no pull request (settings drift, stranger cadence).

# The caller's thin workflow carries the schedule (a weekly cron and workflow_dispatch); everything
# here runs the same on a dispatch, so a person can trigger a pass at any time.

name: weekly

on:
  workflow_call:
    inputs:
      manifest-path:
        type: string
        default: Cargo.toml
      targets:
        type: string
        default: ''
      caller-checks:
        description: Run the settings-drift and stranger jobs (off for the template's selftest).
        type: boolean
        default: true
      mutants-per-shard:
        description: The most mutants one mutation shard tests. The run is split into
          ceil(mutants / this) shards, so a crate under the figure runs as one shard, as before.
          At about 15 seconds a mutant, two at a time, 200 mutants take 25 minutes against the
          mutation job's 60; a crate whose tests are slower lowers it.
        type: number
        default: 200
    secrets:
      SETTINGS_TOKEN:
        description: A fine-grained PAT holding this repository's Administration read-only, for the
          settings-drift reads, plus Contents read and write (GitHub returns the merge settings only to a
          caller with push access). The GITHUB_TOKEN cannot hold the first scope; an organization
          secret named SETTINGS_TOKEN covers every crate repository at once.
        required: false

permissions:
  contents: read

concurrency:
  group: weekly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  MANIFEST: ${{ inputs.manifest-path }}
  TARGETS: ${{ inputs.targets }}

jobs:
  lag:
    name: lag (template release)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - run: .crate-workflows/helpers/lag-check.sh
        env:
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # nife's toolchain-drift, minus the nightly pin: the crate builds on stable, so drift is "the
  # newest stable or beta broke us", and red here is the signal a pin bump owes a fix for.
  drift:
    name: drift (newest stable and beta)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - run: |
          set -e
          rustup toolchain install "${{ matrix.channel }}" --profile minimal --component clippy
          for t in $TARGETS; do rustup +"${{ matrix.channel }}" target add "$t"; done
      - run: |
          set -e
          cargo +"${{ matrix.channel }}" build --manifest-path "$MANIFEST"
          cargo +"${{ matrix.channel }}" test --manifest-path "$MANIFEST"
          cargo +"${{ matrix.channel }}" clippy --manifest-path "$MANIFEST" --all-targets -- -D warnings
          for t in $TARGETS; do
            cargo +"${{ matrix.channel }}" build --manifest-path "$MANIFEST" --target "$t"
          done
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  msrv:
    name: msrv (rust-version builds)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - name: build and test at the stated MSRV
        run: |
          set -e
          msrv=$(python3 .crate-workflows/helpers/read_rust_version.py "$MANIFEST")
          if [ -z "$msrv" ]; then
            echo "no rust-version in $MANIFEST; the standalone gate should have refused this"
            exit 1
          fi
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" build --manifest-path "$MANIFEST"
          cargo +"$msrv" test --manifest-path "$MANIFEST"
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # The interface's stability is measured weekly, as a report: a deliberate break between releases
  # waits for its release, so red here would be noise. The per-pull-request semver rule in label.yml
  # is the one that holds a merge.
  semver:
    name: semver (report against the last release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      # Full history and tags: the baseline is the newest release tag, named by revision.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-semver-checks
      - name: cargo-semver-checks against the previous release tag
        run: |
          set -e
          baseline=$(.crate-workflows/helpers/semver-run.sh "$MANIFEST" semver-report.txt)
          {
            echo "### semver against the last release ($baseline)"
            echo '```'
            python3 .crate-workflows/helpers/semver_major.py semver-report.txt || true
            tail -8 semver.err
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  miri:
    name: miri
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal --component miri
      - run: cargo +nightly miri test --manifest-path "$MANIFEST"
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # Mutation testing in shards. A large crate has thousands of mutants, which one hosted job cannot
  # test inside its timeout, so mutation-plan counts them, `mutation` tests one shard each, and
  # mutation-verdict judges every shard's outcomes together. The verdict job carries the name
  # `mutation`, so `weekly / mutation` stays the one status a caller reads or requires. The shard
  # job keeps the id `mutation`, so a caller's existing budget line for it still applies.
  mutation-plan:
    name: mutation plan (count the mutants)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-mutants@27.1.0
      # The shard count is ceil(mutants / mutants-per-shard), at least one. A matrix holds at most
      # 256 jobs, so a count above that is refused with the input that fixes it.
      - id: plan
        env:
          PER_SHARD: ${{ inputs.mutants-per-shard }}
        run: |
          set -e
          case "$PER_SHARD" in '' | *[!0-9]* | 0)
            echo "::error::mutants-per-shard must be a whole number above zero, got '$PER_SHARD'"
            exit 1
          esac
          cd "$(dirname "$MANIFEST")"
          mutants=$(cargo mutants --list --json | jq length)
          shards=$(( (mutants + PER_SHARD - 1) / PER_SHARD ))
          [ "$shards" -ge 1 ] || shards=1
          if [ "$shards" -gt 256 ]; then
            echo "::error::$mutants mutants at $PER_SHARD a shard is $shards shards, over the 256 a matrix holds; raise mutants-per-shard"
            exit 1
          fi
          echo "==> $mutants mutants in $shards shard(s) of at most $PER_SHARD"
          echo "count=$shards" >> "$GITHUB_OUTPUT"
          echo "shards=$(jq -cn --argjson n "$shards" '[range($n)]')" >> "$GITHUB_OUTPUT"
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  mutation:
    name: mutation shard ${{ matrix.shard }} of ${{ needs.mutation-plan.outputs.count }}
    needs: mutation-plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutation-plan.outputs.shards) }}
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-mutants@27.1.0
      # cargo-mutants exits 2 when a mutant survives and 3 when one times out. Both are verdicts
      # for mutation-verdict to judge against the exemptions once every shard is in, so this step
      # swallows exactly those two codes and no other. Round-robin spreads each file's mutants
      # over every shard, so one slow file does not land on one shard.
      - env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.mutation-plan.outputs.count }}
        run: |
          cd "$(dirname "$MANIFEST")"
          echo "MUTANTS_OUT=$(pwd)/mutants.out" >> "$GITHUB_ENV"
          cargo mutants --jobs 2 --timeout 300 --shard "$SHARD/$SHARDS" --sharding round-robin || rc=$?
          case "${rc:-0}" in
            0 | 2 | 3) ;;
            *) exit "$rc" ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: ${{ env.MUTANTS_OUT }}
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # A report with a tooth: a survivor or a timeout in any shard fails the run unless the caller's
  # .github/mutants-exempts lists it, one mutant per line with its reason. It runs on always(), so
  # a failed plan or shard makes this job red rather than skipped, since a skipped job would
  # satisfy a required status.
  mutation-verdict:
    name: mutation
    needs: [mutation-plan, mutation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - name: every shard ran
        env:
          PLAN: ${{ needs.mutation-plan.result }}
          SHARDS: ${{ needs.mutation.result }}
        run: |
          if [ "$PLAN" != success ] || [ "$SHARDS" != success ]; then
            echo "::error::mutation plan was $PLAN and the shards were $SHARDS; the failing job's log says why"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: mutants-shard-*
          path: ${{ runner.temp }}/mutants-shards
      # Named, with an annotation of its own, so a refusal reads as the gate's and not as the
      # download step above it, whose echoed inputs include the words `digest-mismatch: error`.
      - name: judge the survivors against the exemptions
        env:
          SHARDS: ${{ needs.mutation-plan.outputs.count }}
          OUT: ${{ runner.temp }}/mutants-shards
        run: |
          set -e
          found=$(find "$OUT" -mindepth 2 -maxdepth 2 -name outcomes.json | wc -l)
          if [ "$found" -ne "$SHARDS" ]; then
            echo "::error::$found of $SHARDS shards left an outcomes.json"
            exit 1
          fi
          if ! python3 .crate-workflows/helpers/mutants_gate.py "$OUT" "$GITHUB_WORKSPACE/.github/mutants-exempts"; then
            echo "::error::the mutation gate refused this run: each SURVIVOR, TIMEOUT or stale exemption it names is above"
            exit 1
          fi
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # A setting changed by hand in the web interface is a red run, not a surprise. The comparison is
  # against the settings file at the pinned template commit, so the drift is always measured
  # against the version of the template the caller actually runs.
  #
  # The reads are repository-administration reads (rulesets, environments), and the GITHUB_TOKEN
  # cannot hold that scope: GitHub's parser refuses `administration` in any `permissions` block.
  # So the check authenticates as the SETTINGS_TOKEN secret instead, a fine-grained personal
  # access token with this repository's Administration read-only, stored once as an organization
  # secret so every crate repository inherits it. Until the secret exists the job is red on its
  # 403 with instructions, which is the check working, not failing.
  settings-drift:
    name: settings drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ inputs.caller-checks }}
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - run: .crate-workflows/script/check-settings "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.SETTINGS_TOKEN || github.token }}
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # crates.io and docs.rs answer "not found" for a crate that was never published, so their two
  # badges wait for the first publish (helpers/readme_badges.py --add-published writes them). This
  # job asks crates.io whether the crate exists and fails when the README's badge row disagrees:
  # published without the pair, or the pair without a publish. A failed lookup is a red job, not a
  # guess. It runs here rather than in check because it needs the network.
  crates-io-badges:
    name: crates.io badges
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - run: |
          python3 .crate-workflows/helpers/readme_badges.py --crate-dir "$(dirname "$MANIFEST")" \
            --repository "$GITHUB_REPOSITORY" --published lookup --published-only \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # The release's whole claim is that a stranger can build and prove the crate from its README
  # alone. The run itself needs a person; this job fails when one is overdue, measured from the
  # last recorded run in docs/stranger-test.md.
  stranger:
    name: stranger cadence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ inputs.caller-checks }}
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - run: .crate-workflows/script/stranger-due docs/stranger-test.md
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

# This repository's own gate: script/lint, then a live call of every reusable workflow against
# sample/, a fixture crate. The selftest is the proof that a change here still runs; a change that
# only edits YAML and never sees a green selftest is not done.

name: selftest

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:20 UTC: a canary pass of the whole weekly and mutation workflows against the
    # fixture, so a tool that rots under the template finds out here and not in nine crate
    # repositories.
    - cron: '20 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/') }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint (this repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # script/lint's typos gate needs the tool; the same exact version check.yml installs.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: typos@1.51.1
      # script/lint's actionlint gate needs the binary; the pin and its checksum live in the helper.
      - name: install actionlint
        run: |
          helpers/install_actionlint.sh "$RUNNER_TEMP/actionlint-bin"
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - run: script/lint
      - name: budget
        if: always()
        run: python3 helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  check:
    name: selftest (check)
    needs: lint
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/check.yml
    with:
      manifest-path: sample/Cargo.toml
      allow-unpublished: true

  proofs:
    name: selftest (proofs)
    needs: lint
    permissions:
      contents: read
    uses: ./.github/workflows/proofs.yml
    with:
      manifest-path: sample/Cargo.toml

  weekly:
    name: selftest (weekly)
    needs: lint
    permissions:
      contents: read
    uses: ./.github/workflows/weekly.yml
    with:
      manifest-path: sample/Cargo.toml
      caller-checks: false

  mutation:
    name: selftest (mutation)
    needs: lint
    permissions:
      contents: read
    uses: ./.github/workflows/mutation.yml
    with:
      manifest-path: sample/Cargo.toml
      # The fixture has seven mutants and three exempted survivors. Three a shard splits it into
      # three shards and puts one survivor in each, so mutation-verdict has to merge every shard
      # before all of its exemptions match.
      mutants-per-shard: 3
      # Every run tests every mutant here: the fixture's tree is the same on most pull requests, and a
      # skipped run would prove nothing about the shards. The skip rules are mutation_plan.py's
      # selftest, over fixtures/mutation/.
      skip-unchanged: false
      stagger: false

  # check.yml's mutation-diff job sees this repository's own pull request diffs, which rarely touch
  # the fixture's Rust. So its script runs here on three fixed diffs (fixtures/mutation-diff/): an
  # exempted survivor passes, an untested function fails, and a diff with no Rust passes.
  mutation-diff:
    name: selftest (mutation of changed lines)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-mutants@27.1.0
      - run: sh helpers/mutation-diff-selftest.sh
      - name: budget
        if: always()
        run: python3 helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # The plan's one network step, the read of earlier runs and their record jobs, with the token a
  # caller's plan job has (contents: read). The all-zero fingerprint matches no run, so the answer
  # must be a full run; what this proves is that the reads work and parse.
  mutation-history:
    name: selftest (mutation plan reads earlier runs)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          out=$(GITHUB_OUTPUT='' python3 helpers/mutation_plan.py compare --event workflow_dispatch \
            --repository "$GITHUB_REPOSITORY" --workflow-ref "$GITHUB_WORKFLOW_REF" --branch main \
            --run-id "$GITHUB_RUN_ID" --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --fingerprint "$(printf '0%.0s' $(seq 64))")
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -qx 'mode=full' || { echo "the plan did not decide a full run"; exit 1; }
      - name: budget
        if: always()
        run: python3 helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # The labeler's semver rule against a throwaway crate repository: no break passes, a new break
  # fires, a break already on the base does not hold a later pull request, and a `_typos.toml`-only
  # diff never runs the tool. label.yml needs a pull request event to run, so the rule's helper is
  # what this job drives.
  semver-rule:
    name: selftest (semver rule)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-semver-checks
      - run: helpers/semver-rule.sh --selftest
      - name: budget
        if: always()
        run: python3 helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # The clean fixture goes through the live reusable workflow and must pass.
  fuzz-clean:
    name: selftest (fuzz passes on a clean target)
    needs: lint
    permissions:
      contents: read
    uses: ./.github/workflows/fuzz.yml
    with:
      manifest-path: fixtures/fuzz-clean/Cargo.toml
      public-crash-inputs: true
      seconds-per-target: 20
      total-seconds: 20

  # Without the opt-in the workflow fuzzes nothing, even a crate with a seeded crash.
  fuzz-default:
    name: selftest (fuzz does nothing without the opt-in)
    needs: lint
    permissions:
      contents: read
    uses: ./.github/workflows/fuzz.yml
    with:
      manifest-path: fixtures/fuzz-crash/Cargo.toml

  # A reusable workflow's failure cannot be inverted by its caller, so the seeded crash runs the
  # same script the workflow runs, with the real cargo-fuzz, and the job passes only when the
  # script is red and left a crashing input behind.
  fuzz-crash:
    name: selftest (fuzz fails on a seeded crash)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install --locked cargo-fuzz --version 0.13.2
      - run: |
          if helpers/fuzz-weekly.sh fixtures/fuzz-crash/Cargo.toml 20 20; then
            echo "the fuzz script passed on a seeded crash; the gate is broken"
            exit 1
          fi
          if ! ls fixtures/fuzz-crash/fuzz/artifacts/seeded_crash/crash-* >/dev/null; then
            echo "the fuzz script failed but left no crashing input to upload"
            exit 1
          fi
          echo "==> the fuzz script was red on a seeded crash and kept the input"

  # A reusable workflow's failure cannot be inverted by its caller, so the refusal is proved by the
  # script the workflow runs, on a crate that holds an unsafe block.
  fuzz-unsafe:
    name: selftest (fuzz refuses a crate with unsafe code)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: |
          if helpers/fuzz-weekly.sh fixtures/unsafe-scan/unsafe-block/Cargo.toml 20 20; then
            echo "the fuzz script passed on a crate with unsafe code; the gate is broken"
            exit 1
          fi
          echo "==> the fuzz script refused a crate with unsafe code"

  # The release workflow is not called here: sample/ carries publish = false, on purpose, because a
  # fixture crate must never reach crates.io. Its gate and dry-run publish are exercised in a
  # throwaway repository before a template release is cut (the roadmap block's exit).
  release:
    name: selftest (release gate refuses a red commit)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Prove the refusal half of the release path on every change: the gate must be red on a
      # commit whose checks have not run. The green half needs a published template release and a
      # real caller, which is the throwaway repository's job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          set -e
          # This selftest run itself is the only run on this SHA, and it is not a green ci.yml run,
          # so the gate must refuse.
          if helpers/release-gate.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA"; then
            echo "release-gate passed on a commit with no green check run; the refusal is broken"
            exit 1
          fi
          echo "==> the release gate refused an unchecked commit"
      # The mutation half of the gate, alone, with the default token. This repository has no
      # mutation caller, so the read goes to this selftest workflow, whose only run at this commit
      # is this one, still in flight: no green run, so the verify step must refuse, for that
      # reason. Its accept and refuse rules are mutation_plan.py's selftest, over
      # fixtures/mutation/release/.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python3 helpers/mutation_plan.py verify "$GITHUB_REPOSITORY" "$GITHUB_SHA" --workflow selftest.yml 2>err; then
            echo "the mutation gate passed a commit with no green run; the refusal is broken"
            exit 1
          fi
          cat err
          grep -q 'no green full mutation run at this commit' err || { echo "refused, but not for the reason under test"; exit 1; }
          echo "==> the mutation gate refused a commit with no green run"

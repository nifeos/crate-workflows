# The reusable release workflow: gate on green proofs, tag, publish through an approved environment.

# The caller dispatches it with a version. `gate` refuses unless the check and proof runs for this
# exact commit are green, so a tag whose proof job is red never gets made. `tag` creates `v<version>`
# and is the only thing in the crate repository that may. `publish` runs last, in the `crates-io`
# environment (a person approves), holding `id-token: write` and nothing else, and exchanges the
# OIDC token for a temporary crates.io token through trusted publishing (Fork 6). `dry-run`
# defaults to true: a rehearsal runs the gate and a `cargo publish --dry-run` and creates no tag.

name: release

on:
  workflow_call:
    inputs:
      version:
        description: The version to release, matching the manifest (e.g. 0.1.0).
        type: string
        required: true
      manifest-path:
        type: string
        default: Cargo.toml
      dry-run:
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  MANIFEST: ${{ inputs.manifest-path }}

jobs:
  gate:
    name: gate (checks and proofs green on this commit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - name: the manifest's version is the version being released
        run: |
          set -e
          stated=$(python3 .crate-workflows/helpers/read_version.py "$MANIFEST")
          if [ "$stated" != "${{ inputs.version }}" ]; then
            echo "$MANIFEST says $stated; the dispatch named ${{ inputs.version }}."
            echo "Bump the manifest (and the changelog) first, then dispatch again."
            exit 1
          fi
      - name: check and proofs are green on this commit
        run: .crate-workflows/helpers/release-gate.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  tag:
    name: tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: gate
    if: ${{ !inputs.dry-run }}
    permissions:
      contents: write
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - name: create the tag (refusing one that exists)
        run: |
          set -e
          ref="refs/tags/v${{ inputs.version }}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "the tag v${{ inputs.version }} already exists; a tag is never updated"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=$ref" -f "sha=$GITHUB_SHA"
          echo "created $ref at $GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [gate, tag]
    # A dry run skips `tag`; the release must still publish nothing without that job either
    # passing (a real release) or being skipped by the dry run (a rehearsal).
    if: ${{ always() && needs.gate.result == 'success' &&
            (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: package builds (cargo publish --dry-run)
        run: cargo publish --manifest-path "$MANIFEST" --dry-run
      - name: exchange the OIDC token for a crates.io token
        if: ${{ !inputs.dry-run }}
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: publish
        if: ${{ !inputs.dry-run }}
        run: cargo publish --manifest-path "$MANIFEST" --token "${{ steps.auth.outputs.token }}"
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

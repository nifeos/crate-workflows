# The reusable release workflow: gate on green proofs, tag, publish through an approved environment.

# The caller dispatches it with a version. `gate` refuses unless the check and proof runs for this
# exact commit are green, so a tag whose proof job is red never gets made. `tag` creates `v<version>`
# and is the only thing in the crate repository that may. `publish` runs last, in the `crates-io`
# environment (a person approves), holding `id-token: write` and nothing else, and exchanges the
# OIDC token for a temporary crates.io token through trusted publishing (Fork 6); a crate's first
# publish, before any trusted publisher can exist, uses the environment's scoped token instead.
# `dry-run`
# defaults to true: a rehearsal runs the gate and a `cargo publish --dry-run` and creates no tag.

name: release

on:
  workflow_call:
    inputs:
      version:
        description: The version to release, matching the manifest (e.g. 0.1.0).
        type: string
        required: true
      manifest-path:
        type: string
        default: Cargo.toml
      dry-run:
        type: boolean
        default: true
    secrets:
      NIFE_SMELTER_APP_ID:
        description: The nife-smelter app's ID, an organization secret. `tag` mints an installation
          token from it and the private key, because the tags ruleset refuses github.token.
        required: false
      NIFE_SMELTER_PRIVATE_KEY:
        description: The nife-smelter app's private key (the whole PEM), an organization secret.
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  MANIFEST: ${{ inputs.manifest-path }}

jobs:
  gate:
    name: gate (checks and proofs green on this commit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - name: the manifest's version is the version being released
        run: |
          set -e
          stated=$(python3 .crate-workflows/helpers/read_version.py "$MANIFEST")
          if [ "$stated" != "${{ inputs.version }}" ]; then
            echo "$MANIFEST says $stated; the dispatch named ${{ inputs.version }}."
            echo "Bump the manifest (and the changelog) first, then dispatch again."
            exit 1
          fi
      - name: check and proofs are green on this commit
        run: .crate-workflows/helpers/release-gate.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  tag:
    name: tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: gate
    if: ${{ !inputs.dry-run }}
    permissions:
      contents: read
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      # The tags ruleset lets only the nife-smelter app create a v* tag, and github.token is not
      # permitted as a bypass actor. There is no fallback to github.token: a missing secret is a red
      # job that names what to create, because a fallback would fail later with a bare 422.
      - name: the app credentials exist
        run: |
          missing=""
          [ -n "$APP_ID" ] || missing="$missing NIFE_SMELTER_APP_ID"
          [ -n "$APP_KEY" ] || missing="$missing NIFE_SMELTER_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "missing secret(s):$missing"
            echo "Create them as organization secrets (nife-smelter's app ID and private key), visible"
            echo "to this repository, and pass them from the caller's release job."
            exit 1
          fi
        env:
          APP_ID: ${{ secrets.NIFE_SMELTER_APP_ID }}
          APP_KEY: ${{ secrets.NIFE_SMELTER_PRIVATE_KEY }}
      - name: mint a nife-smelter installation token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.NIFE_SMELTER_APP_ID }}
          private-key: ${{ secrets.NIFE_SMELTER_PRIVATE_KEY }}
          permission-contents: write
      - name: create the tag (refusing one that exists)
        run: |
          set -e
          ref="refs/tags/v${{ inputs.version }}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "the tag v${{ inputs.version }} already exists; a tag is never updated"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=$ref" -f "sha=$GITHUB_SHA"
          echo "created $ref at $GITHUB_SHA"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [gate, tag]
    # A dry run skips `tag`; the release must still publish nothing without that job either
    # passing (a real release) or being skipped by the dry run (a rehearsal).
    if: ${{ always() && needs.gate.result == 'success' &&
            (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: package builds (cargo publish --dry-run)
        run: cargo publish --manifest-path "$MANIFEST" --dry-run
      # A trusted publisher binds only to a crate that exists, so a crate's first publish uses the
      # crates-io environment's CRATES_IO_FIRST_PUBLISH_TOKEN (provisional name). The mode follows
      # the crate's presence on crates.io, not the secret's: an existing crate is published through
      # trusted publishing only, and a failed exchange there never falls back to the token. The
      # step runs in a dry run too, so a rehearsal says which door the real release would use.
      - name: first publish (token) or later release (trusted publishing)
        id: mode
        run: |
          if [ -n "$FIRST_PUBLISH_TOKEN" ]; then
            python3 .crate-workflows/helpers/publish_mode.py plan "$MANIFEST" --token-present
          else
            python3 .crate-workflows/helpers/publish_mode.py plan "$MANIFEST"
          fi
        env:
          FIRST_PUBLISH_TOKEN: ${{ secrets.CRATES_IO_FIRST_PUBLISH_TOKEN }}
      - name: exchange the OIDC token for a crates.io token
        if: ${{ !inputs.dry-run && steps.mode.outputs.mode == 'trusted' }}
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: publish through trusted publishing
        if: ${{ !inputs.dry-run && steps.mode.outputs.mode == 'trusted' }}
        run: cargo publish --manifest-path "$MANIFEST" --token "${{ steps.auth.outputs.token }}"
      - name: publish the crate's first version with the scoped token
        if: ${{ !inputs.dry-run && steps.mode.outputs.mode == 'token' }}
        run: cargo publish --manifest-path "$MANIFEST"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_FIRST_PUBLISH_TOKEN }}
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

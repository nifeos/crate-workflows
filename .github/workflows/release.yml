# The reusable release workflow: gate on green proofs, tag, publish through an approved environment.

# The caller dispatches it with a version. `gate` refuses unless the check and proof runs for this
# exact commit are green, so a tag whose proof job is red never gets made. `tag` creates `v<version>`
# and is the only thing in the crate repository that may. `publish` runs last, in the `crates-io`
# environment (a person approves), holding `id-token: write` and nothing else, and exchanges the
# OIDC token for a temporary crates.io token through trusted publishing (Fork 6); a crate's first
# publish, before any trusted publisher can exist, uses the environment's scoped token instead.
# `dry-run` defaults to true: a rehearsal runs the gate, then `rehearse` (a package build, in no
# environment and with no secret, so nothing waits for approval) and creates no tag. `publish: false`
# with `dry-run: false` is tag-only: gate and tag, no publish job.

name: release

on:
  workflow_call:
    inputs:
      version:
        description: The version to release, matching the manifest (e.g. 0.1.0).
        type: string
        required: true
      manifest-path:
        type: string
        default: Cargo.toml
      dry-run:
        type: boolean
        default: true
      # Tag-only mode: with publish false a real run (dry-run false) gates and tags and stops. The
      # publish job, and with it the crates-io environment, is never reached. Callers pass false.
      publish:
        description: Run the publish job after tagging. False tags and stops.
        type: boolean
        default: true
    secrets:
      NIFE_SMELTER_APP_ID:
        description: The release app's ID, an organization secret. `tag` mints an installation
          token from it and the private key, because the tags ruleset refuses github.token.
        required: false
      NIFE_SMELTER_PRIVATE_KEY:
        description: The release app's private key (the whole PEM), an organization secret.
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  MANIFEST: ${{ inputs.manifest-path }}

jobs:
  gate:
    name: gate (checks and proofs green on this commit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - name: the manifest's version is the version being released
        run: |
          set -e
          stated=$(python3 .crate-workflows/helpers/read_version.py "$MANIFEST")
          if [ "$stated" != "${{ inputs.version }}" ]; then
            echo "$MANIFEST says $stated; the dispatch named ${{ inputs.version }}."
            echo "Bump the manifest (and the changelog) first, then dispatch again."
            exit 1
          fi
      # A crate needs a stranger-test run on record before its first release (ruled 2026-11-01
      # UTC). The weekly cadence job is separate and also fails closed on 'Last run: none', so a
      # new repository's weekly run is red until its first stranger run is recorded.
      - name: a stranger-test run is on record
        run: .crate-workflows/script/stranger-recorded docs/stranger-test.md
      - name: check, proofs and a full mutation run are green on this commit
        run: .crate-workflows/helpers/release-gate.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  tag:
    name: tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: gate
    if: ${{ !inputs.dry-run }}
    permissions:
      contents: read
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      # The tags ruleset lets only the release app create a v* tag, and github.token is not
      # permitted as a bypass actor. There is no fallback to github.token: a missing secret is a red
      # job that names what to create, because a fallback would fail later with a bare 422.
      - name: the app credentials exist
        run: |
          missing=""
          [ -n "$APP_ID" ] || missing="$missing NIFE_SMELTER_APP_ID"
          [ -n "$APP_KEY" ] || missing="$missing NIFE_SMELTER_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "missing secret(s):$missing"
            echo "Create them as organization secrets (the release app's ID and private key), visible"
            echo "to this repository, and pass them from the caller's release job."
            exit 1
          fi
        env:
          APP_ID: ${{ secrets.NIFE_SMELTER_APP_ID }}
          APP_KEY: ${{ secrets.NIFE_SMELTER_PRIVATE_KEY }}
      - name: mint the release app's installation token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.NIFE_SMELTER_APP_ID }}
          private-key: ${{ secrets.NIFE_SMELTER_PRIVATE_KEY }}
          permission-contents: write
      - name: create the tag (refusing one that exists)
        run: |
          set -e
          ref="refs/tags/v${{ inputs.version }}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "the tag v${{ inputs.version }} already exists; a tag is never updated"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=$ref" -f "sha=$GITHUB_SHA"
          echo "created $ref at $GITHUB_SHA"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # A rehearsal: runs in no environment and holds no secret, so nothing waits for approval and
  # nothing can publish. A crate that carries publish = false (a soak) is packaged with cargo
  # package, because cargo publish refuses it even with --dry-run.
  rehearse:
    name: rehearse (package builds, no environment)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: gate
    if: ${{ inputs.dry-run }}
    permissions:
      contents: read
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      # The template checkout lies inside the crate's tree, and cargo refuses to package a tree with
      # files git does not know. Git is told to ignore it, so a crate without an `include` list
      # packages, and the template's files never reach the archive.
      - name: keep the template checkout out of the package
        run: echo '/.crate-workflows/' >> .git/info/exclude
      - run: rustup toolchain install stable --profile minimal
      - name: package builds
        run: |
          set -e
          unpublished=$(python3 -c 'import sys,tomllib; p=tomllib.load(open(sys.argv[1],"rb")).get("package",{}).get("publish"); print("yes" if p is False else "no")' "$MANIFEST")
          if [ "$unpublished" = yes ]; then
            echo "publish = false: rehearsing with cargo package, which builds the same archive"
            cargo package --manifest-path "$MANIFEST" --list
            cargo package --manifest-path "$MANIFEST"
          else
            cargo publish --manifest-path "$MANIFEST" --dry-run
          fi
      # The crates-io environment's secrets are not visible here, so this says only whether the
      # crate exists on crates.io; the real release reads the token from the environment.
      - name: which door a real release would use
        run: python3 .crate-workflows/helpers/publish_mode.py plan "$MANIFEST" || true
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [gate, tag]
    # Only a real release with publish true reaches here. A dry run takes `rehearse`, which has no
    # environment, and a tag-only run (publish false) stops after `tag`, so neither asks a person to
    # approve a deployment.
    if: ${{ !inputs.dry-run && inputs.publish }}
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      # The template checkout lies inside the crate's tree, and cargo refuses to package a tree with
      # files git does not know. Git is told to ignore it, so a crate without an `include` list
      # packages, and the template's files never reach the archive.
      - name: keep the template checkout out of the package
        run: echo '/.crate-workflows/' >> .git/info/exclude
      - run: rustup toolchain install stable --profile minimal
      - name: package builds (cargo publish --dry-run)
        run: cargo publish --manifest-path "$MANIFEST" --dry-run
      # A trusted publisher binds only to a crate that exists, so a crate's first publish uses the
      # crates-io environment's CRATES_IO_FIRST_PUBLISH_TOKEN (provisional name). The mode follows
      # the crate's presence on crates.io, not the secret's: an existing crate is published through
      # trusted publishing only, and a failed exchange there never falls back to the token. The
      # step runs in a dry run too, so a rehearsal says which door the real release would use.
      - name: first publish (token) or later release (trusted publishing)
        id: mode
        run: |
          if [ -n "$FIRST_PUBLISH_TOKEN" ]; then
            python3 .crate-workflows/helpers/publish_mode.py plan "$MANIFEST" --token-present
          else
            python3 .crate-workflows/helpers/publish_mode.py plan "$MANIFEST"
          fi
        env:
          FIRST_PUBLISH_TOKEN: ${{ secrets.CRATES_IO_FIRST_PUBLISH_TOKEN }}
      - name: exchange the OIDC token for a crates.io token
        if: ${{ steps.mode.outputs.mode == 'trusted' }}
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: publish through trusted publishing
        if: ${{ steps.mode.outputs.mode == 'trusted' }}
        run: cargo publish --manifest-path "$MANIFEST" --token "${{ steps.auth.outputs.token }}"
      - name: publish the crate's first version with the scoped token
        if: ${{ steps.mode.outputs.mode == 'token' }}
        run: cargo publish --manifest-path "$MANIFEST"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_FIRST_PUBLISH_TOKEN }}
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

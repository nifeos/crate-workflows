# The reusable label workflow: the architect rules a crate repository keeps.

# Two rules, both from nife's labeler, reduced to what a standalone crate carries:
#   1. a dependency new to the crate's graph (helpers/architect-label-rules.py);
#   2. a major break cargo-semver-checks reports against the last release that the pull request
#      introduces (helpers/semver-rule.sh); a break already on the base branch does not count.
# The labeler only ever adds `needs-architect`; a recorded ruling swaps it, through
# script/record-ruling or the ruled workflow. The hold check (hold.yml) is the required gate that
# keeps the pull request red until then.

# Each rule step re-resolves the merge base itself, because steps do not share shell state. The
# base is the base branch's real current tip through origin, never the payload's cached sha
# (nife's #1416 was flagged for a dependency a DIFFERENT pull request had added to main; the
# cached sha pointed one merge behind it).

name: architect label

on:
  workflow_call:
    inputs:
      manifest-path:
        type: string
        default: Cargo.toml

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: architect-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  MANIFEST: ${{ inputs.manifest-path }}
  PR: ${{ github.event.pull_request.number }}

jobs:
  label:
    name: label
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      # Full history and no blobs: the dependency rule reads base manifests out of git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - name: skip while a ruling stands
        run: |
          set -e
          labels="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR" --jq '.labels[].name')"
          if printf '%s\n' "$labels" | grep -qx architect-ruled || printf '%s\n' "$labels" | grep -qx held-by-lane; then
            echo "A ruling label is on; the labeler stands down."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: rule 1, a dependency new to the graph
        if: env.SKIP != '1'
        run: |
          set -e
          base=$(.crate-workflows/helpers/scope-merge-base.sh \
              "${{ github.event.pull_request.base.ref }}" \
              "${{ github.event.pull_request.base.sha }}") || {
            echo "could not resolve a merge base; routing to a person"; exit 1
          }
          set +e
          git diff --unified=1000000 "$base" HEAD |
            python3 .crate-workflows/helpers/architect-label-rules.py --base-rev "$base" > findings.txt
          rc=$?
          set -e
          case "$rc" in
            0) echo "the dependency rule fired" ;;
            1) : > findings.txt; echo "no new dependency" ;;
            *) echo "architect-label-rules.py exited $rc; routing to a person"; exit 1 ;;
          esac
      - name: rule 2, a semver break new in this pull request
        if: env.SKIP != '1'
        run: |
          set -e
          base=$(.crate-workflows/helpers/scope-merge-base.sh \
              "${{ github.event.pull_request.base.ref }}" \
              "${{ github.event.pull_request.base.sha }}")
          if ! git diff --name-only "$base" HEAD | grep -qE '(\.rs|(^|/)Cargo\.toml)$'; then
            echo "no Rust source or manifest change; the semver rule does not run"
            exit 0
          fi
          rustup toolchain install stable --profile minimal
          cargo +stable semver-checks --version >/dev/null 2>&1 || cargo install --locked cargo-semver-checks
          # The baseline is the newest release tag before this commit, else the last published
          # version; a crate with neither has no baseline, which is "nothing major yet". The rule
          # holds only a major break the merge base did not already carry: a break that reached
          # main in an earlier pull request was ruled there and waits for its release.
          # helpers/semver-rule.sh says how. Its trigger filter is the one above, repeated here so a
          # pull request that runs no tool installs none; script/lint keeps the two the same.
          # Every crate that has releases to compare against (helpers/crate_info.py, RELEASE
          # TARGET): one for a repository of one crate, each publishable member for several. A
          # member that may not be published has no release, so no break to hold a merge for.
          targets=$(python3 .crate-workflows/helpers/crate_info.py members "$MANIFEST" --release-targets)
          [ -n "$targets" ] || echo "no crate here has a release to compare against"
          for target in $targets; do
            echo "==> semver rule: $target"
            set +e
            RUSTUP_TOOLCHAIN=stable .crate-workflows/helpers/semver-rule.sh "$target" "$base" semver-found.txt
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              cat semver.err >&2 || true
              echo "semver-rule.sh exited $rc on $target; routing to a person"
              exit 1
            fi
            if [ -s semver-found.txt ]; then
              if [ "$(printf '%s\n' "$targets" | wc -l)" -gt 1 ]; then
                echo "semver, $target:" >> findings.txt
              fi
              cat semver-found.txt >> findings.txt
              echo "the semver rule fired on $target"
            fi
          done
      - name: hold the pull request when a rule fired
        if: env.SKIP != '1'
        run: |
          set -e
          if [ -s findings.txt ]; then
            cat findings.txt
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR" -f 'labels[]=needs-architect' >/dev/null
            .crate-workflows/helpers/label-comment.sh "$PR" "$GITHUB_REPOSITORY" "$(cat findings.txt)"
          else
            echo "no rule fired"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

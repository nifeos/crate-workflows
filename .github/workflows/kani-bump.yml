# Propose a Kani bump; never apply one. The pin is `.kani-version`, which proofs.yml installs
# exactly; crate repositories receive a new Kani only through their own pin of this template.
#
#   1. PROPOSE (here): compare the pin with the newest kani-verifier on crates.io, open or update
#      one pull request that changes only `.kani-version`.
#   2. VERIFY (selftest, on that pull request): `selftest (proofs) / kani` and `/ falsify` run the
#      new Kani against sample/. There is no separate gate for a bump.
#   3. ACCEPT: the default is to merge. Hold it only when a proof or falsification result changed.
#
# Provisional name, for calef's naming pass, like the rest of this repository.

name: kani bump

on:
  schedule:
    # Wednesdays 07:00 UTC, away from the Monday selftest canary.
    - cron: '0 7 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kani-bump
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  propose:
    name: propose a Kani bump
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # A push or pull request made with github.token triggers no workflows, so the proposed pull
      # request would never run its selftest. The nife-smelter app's token does. There is no
      # fallback to github.token: a missing secret is a red job that names what to create.
      - name: the app credentials exist
        run: |
          missing=""
          [ -n "$APP_ID" ] || missing="$missing NIFE_SMELTER_APP_ID"
          [ -n "$APP_KEY" ] || missing="$missing NIFE_SMELTER_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "missing secret(s):$missing"
            echo "Create them as organization secrets (nife-smelter's app ID and private key), visible"
            echo "to this repository. The app needs contents and pull requests write here."
            exit 1
          fi
        env:
          APP_ID: ${{ secrets.NIFE_SMELTER_APP_ID }}
          APP_KEY: ${{ secrets.NIFE_SMELTER_PRIVATE_KEY }}
      - name: mint a nife-smelter installation token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.NIFE_SMELTER_APP_ID }}
          private-key: ${{ secrets.NIFE_SMELTER_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app.outputs.token }}
      - name: compare the pin with crates.io
        id: plan
        run: python3 helpers/kani_bump.py plan >> "$GITHUB_OUTPUT"
      - name: nothing to propose
        if: steps.plan.outputs.bump != 'true'
        run: echo "kani-verifier ${{ steps.plan.outputs.newest }} is not newer than the pin ${{ steps.plan.outputs.current }}."
      # One pull request on a fixed branch, force-pushed in place, so a second newer release before
      # the first is merged updates the same pull request instead of opening another.
      - name: open or update the pull request
        if: steps.plan.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CURRENT: ${{ steps.plan.outputs.current }}
          NEWEST: ${{ steps.plan.outputs.newest }}
        run: |
          set -e
          branch=kani-bump
          title="Kani $CURRENT to $NEWEST"
          body="$(printf '%s\n' \
            "Automated by \`.github/workflows/kani-bump.yml\`: kani-verifier $NEWEST is on crates.io and the pin is $CURRENT. This changes only \`.kani-version\`." \
            "" \
            "Release notes: https://github.com/model-checking/kani/releases/tag/kani-$NEWEST" \
            "" \
            "\`selftest (proofs) / kani\` and \`/ falsify\` are the verification. Merge when green; hold it only if a proof or falsification result changed. Crate repositories get this Kani when they next bump their pin of this template.")"
          git config user.name 'nife-smelter[bot]'
          git config user.email 'nife-smelter[bot]@users.noreply.github.com'
          git switch -C "$branch"
          printf '%s\n' "$NEWEST" > .kani-version
          git add .kani-version
          git commit -m "$title"
          git push --force origin "$branch"
          if existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" && [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
            echo "updated pull request $existing"
          else
            gh pr create --head "$branch" --base main --title "$title" --body "$body"
          fi

# The reusable proofs workflow: Kani on every pull request, and every falsification patch replayed.

# Fork 4's ruling, adapted: stock Kani proves the crate; each falsification patch is
# applied and must turn its harness red at its own assertion. A crate has few harnesses, so this
# runs on every pull request rather than weekly.

name: proofs

on:
  workflow_call:
    inputs:
      manifest-path:
        type: string
        default: Cargo.toml
      toolchain:
        type: string
        default: stable
      kani-args:
        description: Extra arguments for cargo kani (features, --tests, ...).
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: proofs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/') }}

defaults:
  run:
    shell: bash

env:
  MANIFEST: ${{ inputs.manifest-path }}
  TOOLCHAIN: ${{ inputs.toolchain }}

jobs:
  lag:
    name: lag (template release)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - run: .crate-workflows/helpers/lag-check.sh
        env:
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  kani:
    name: kani
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      # Stock Kani on every pull request (Fork 4), at the version the template's own `.kani-version`
      # names, read from the pinned template checkout so a crate inherits it through its pin. The
      # install runs from the runner's temp directory so it uses the runner's default toolchain,
      # not a crate-pinned one; `cargo kani` itself runs in the crate and honors its
      # rust-toolchain.toml. The marketplace action is not used: it calls unpinned actions inside.
      - name: Install Kani
        run: |
          cd "$RUNNER_TEMP"
          cargo install --locked kani-verifier --version "$(cat "$GITHUB_WORKSPACE/.crate-workflows/.kani-version")"
          cargo kani setup
      - name: prove
        run: cargo kani --manifest-path "$MANIFEST" ${{ inputs.kani-args }}
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  falsify:
    name: falsify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      # The replay runs `cargo kani` itself, so it installs the same pinned Kani as the job above
      # (nife measured caching the install as not worth a cache step).
      - name: Install Kani
        run: |
          cd "$RUNNER_TEMP"
          cargo install --locked kani-verifier --version "$(cat "$GITHUB_WORKSPACE/.crate-workflows/.kani-version")"
          cargo kani setup
      # Form first (every harness carries a patch or a reason), then truth (each patch turns exactly
      # its own harness red). A survivor, a stale patch, or an unparseable verdict fails the job.
      - run: python3 .crate-workflows/helpers/falsify.py --manifest-path "$MANIFEST"
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

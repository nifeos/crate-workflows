# The reusable proofs workflow: Kani on every pull request, and every falsification patch replayed.

# Fork 4's ruling, adapted: stock Kani proves the crate; each falsification patch is
# applied and must turn its harness red at its own assertion. A crate has few harnesses, so this
# runs on every pull request rather than weekly.

# A crate that depends on loom also has its loom models run, with `--cfg loom` in release mode. A
# crate that does not reports the loom job as skipped, which a required check counts as passed.

name: proofs

on:
  workflow_call:
    inputs:
      manifest-path:
        type: string
        default: Cargo.toml
      toolchain:
        type: string
        default: stable
      kani-args:
        description: Extra arguments for cargo kani (features, --tests, ...).
        type: string
        default: ''
      loom-max-preemptions:
        description: >-
          LOOM_MAX_PREEMPTIONS for the loom models, a whole number. Empty means no bound, so loom
          explores every interleaving.
        type: string
        default: ''
      harnesses-per-shard:
        description: >-
          The most falsification patches one falsify shard replays. The replays are split into
          ceil(replayable records / this) shards, so a crate at or under the figure runs one shard.
          At about five minutes for a slow harness, three keep a shard near 15 minutes against its
          30; a crate whose harnesses are slower lowers it.
        type: number
        default: 3

permissions:
  contents: read

concurrency:
  group: proofs-${{ github.workflow }}-${{ github.ref }}${{ (inputs.manifest-path != 'Cargo.toml' && inputs.manifest-path != './Cargo.toml') && format('-{0}', inputs.manifest-path) || '' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/') }}

defaults:
  run:
    shell: bash

env:
  MANIFEST: ${{ inputs.manifest-path }}
  TOOLCHAIN: ${{ inputs.toolchain }}

jobs:
  lag:
    name: lag (template release)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - run: .crate-workflows/helpers/lag-check.sh
        env:
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  kani:
    name: kani
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      # Stock Kani on every pull request (Fork 4), at the version the template's own `.kani-version`
      # names, read from the pinned template checkout so a crate inherits it through its pin. The
      # install runs from the runner's temp directory so it uses the runner's default toolchain,
      # not a crate-pinned one; `cargo kani` itself runs in the crate and honors its
      # rust-toolchain.toml. The marketplace action is not used: it calls unpinned actions inside.
      - name: Install Kani
        run: |
          cd "$RUNNER_TEMP"
          cargo install --locked kani-verifier --version "$(cat "$GITHUB_WORKSPACE/.crate-workflows/.kani-version")"
          cargo kani setup
      - name: prove
        run: cargo kani --manifest-path "$MANIFEST" ${{ inputs.kani-args }}
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # The falsification replays, in shards, so the time a crate waits does not grow with its harness
  # count: falsify-plan runs the form check and counts the replayable records, `falsify` replays one
  # shard each, and falsify-verdict judges the plan and every shard together. The verdict job
  # carries the name `falsify`, so `proofs / falsify` stays the one required check. The shard job
  # keeps the id `falsify`, so a caller's budget line for it still applies.
  falsify-plan:
    name: falsify plan (form check, then count the shards)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards || '[0]' }}
      count: ${{ steps.plan.outputs.count || '0' }}
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      # Form first, once for every shard: every harness carries a patch or a reason, and every
      # patch applies. It needs no Kani.
      - name: form check
        run: python3 .crate-workflows/helpers/falsify.py --manifest-path "$MANIFEST" --check
      # The shard count is ceil(replayable records / harnesses-per-shard), 0 when there is none, in
      # which case the shards are skipped. A matrix holds at most 256 jobs, so a count above that is
      # refused with the input that fixes it.
      - id: plan
        env:
          PER_SHARD: ${{ inputs.harnesses-per-shard }}
        run: |
          set -e
          case "$PER_SHARD" in '' | *[!0-9]* | 0)
            echo "::error::harnesses-per-shard must be a whole number above zero, got '$PER_SHARD'"
            exit 1
          esac
          shards=$(python3 .crate-workflows/helpers/falsify.py --manifest-path "$MANIFEST" --plan "$PER_SHARD")
          if [ "$shards" -gt 256 ]; then
            echo "::error::$shards falsify shards at $PER_SHARD a shard is over the 256 a matrix holds; raise harnesses-per-shard"
            exit 1
          fi
          echo "==> the falsification replays take $shards shard(s) of at most $PER_SHARD"
          echo "count=$shards" >> "$GITHUB_OUTPUT"
          echo "shards=$(jq -cn --argjson n "$shards" '[range($n)]')" >> "$GITHUB_OUTPUT"
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  falsify:
    name: falsify shard ${{ matrix.shard }} of ${{ needs.falsify-plan.outputs.count }}
    needs: falsify-plan
    if: needs.falsify-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Every shard at once: falsify runs on every pull request, and a crate with a shard per three
    # harnesses holds a few hosted runners for minutes, where one job held one for half an hour.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.falsify-plan.outputs.shards) }}
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      # The replay runs `cargo kani` itself, so it installs the same pinned Kani as the kani job
      # (nife measured caching the install as not worth a cache step).
      - name: Install Kani
        run: |
          cd "$RUNNER_TEMP"
          cargo install --locked kani-verifier --version "$(cat "$GITHUB_WORKSPACE/.crate-workflows/.kani-version")"
          cargo kani setup
      # Truth: each patch in this shard turns exactly its own harness red. A survivor, a stale
      # patch, or an unparseable verdict fails the shard. Round-robin spreads the harnesses of one
      # file, which are often slow together, over every shard.
      - name: replay
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.falsify-plan.outputs.count }}
        run: python3 .crate-workflows/helpers/falsify.py --manifest-path "$MANIFEST" --shard "$SHARD/$SHARDS"
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  # It runs on always(), so a failed plan or shard makes this job red rather than skipped, since a
  # skipped job would satisfy a required status. Shards skipped because the plan counted none pass.
  falsify-verdict:
    name: falsify
    needs: [falsify-plan, falsify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          PLAN: ${{ needs.falsify-plan.result }}
          COUNT: ${{ needs.falsify-plan.outputs.count }}
          SHARDS: ${{ needs.falsify.result }}
        run: |
          if [ "$PLAN" != success ]; then
            echo "::error::falsify plan was $PLAN; its log says why"
            exit 1
          fi
          if [ "$COUNT" = 0 ] && [ "$SHARDS" = skipped ]; then
            echo "==> falsify: no replayable record, so no shard ran; the form check passed"
            exit 0
          fi
          if [ "$SHARDS" != success ]; then
            echo "::error::the falsify shards were $SHARDS; the failing shard's log names the record"
            exit 1
          fi
          echo "==> falsify: the form check and all $COUNT shard(s) passed"

  loom-plan:
    name: loom plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      uses-loom: ${{ steps.plan.outputs.uses-loom }}
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      # yes for a loom dependency of any kind (a cfg(loom) target table, a dev-dependency, one a
      # workspace lends); helpers/crate_info.py reads it from cargo metadata.
      - id: plan
        run: |
          if python3 .crate-workflows/helpers/crate_info.py uses-loom "$MANIFEST"; then
            echo "uses-loom=true" >> "$GITHUB_OUTPUT"
          else
            echo "uses-loom=false" >> "$GITHUB_OUTPUT"
            echo "==> the crate does not depend on loom; the loom job is skipped"
          fi
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

  loom:
    name: loom
    needs: loom-plan
    if: needs.loom-plan.outputs.uses-loom == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: clock
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .crate-workflows
          persist-credentials: false
      - run: rustup toolchain install "$TOOLCHAIN" --profile minimal
      # Every test under --cfg loom, in release mode, with warnings denied. A model that finds a bad
      # interleaving fails, and so does a run in which no model ran.
      - name: models
        run: .crate-workflows/helpers/loom-check.sh "$MANIFEST" "$LOOM_BOUND"
        env:
          RUSTUP_TOOLCHAIN: ${{ inputs.toolchain }}
          LOOM_BOUND: ${{ inputs.loom-max-preemptions }}
      # A loom model may carry a Falsification: record; each patch is applied and its one model
      # must fail under --cfg loom. A survivor, a stale patch or an unread verdict fails the job. A
      # crate whose models carry no record has nothing to replay.
      - name: falsify
        run: python3 .crate-workflows/helpers/falsify.py --loom --manifest-path "$MANIFEST"
        env:
          RUSTUP_TOOLCHAIN: ${{ inputs.toolchain }}
      - name: budget
        if: always()
        run: python3 .crate-workflows/helpers/job_budget.py check "${{ github.job }}" "$JOB_STARTED_AT"

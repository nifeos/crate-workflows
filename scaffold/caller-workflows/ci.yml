name: check
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    permissions:
      contents: read
      security-events: write
    uses: nifeos/crate-workflows/.github/workflows/check.yml@PINS@
    with:
      # Bare-metal targets the crate builds for, space-separated; empty for a host-only crate.
      targets: ''

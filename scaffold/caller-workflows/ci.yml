name: check
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # No push trigger: a push-triggered cross-repository reusable call start-fails on GitHub with
  # an empty error (crate-workflows-test runs 38914536439 and 38914537601, against the same file
  # that is green on pull_request). It is not needed: a pull request's runs are recorded at the
  # merge commit's SHA, which is exactly the commit a release dispatches at, and that is what the
  # release gate reads.
permissions:
  contents: read
jobs:
  ci:
    permissions:
      contents: read
      security-events: write
    uses: nifeos/crate-workflows/.github/workflows/check.yml@PINS@
    with:
      # Bare-metal targets the crate builds for, space-separated; empty for a host-only crate.
      targets: ''

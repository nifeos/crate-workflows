# Acronyms that need no expansion, read by prose_acronyms.py (its header is the manual). Words every
# reader of a Rust crate and its repository knows. Keep the list short: an acronym that is not here
# is expanded where the file first uses it. The file's name and its key are provisional.
allow = [
    "AI", "API", "ASCII", "BSD", "CI", "CLI", "CPU", "GPL", "HTML", "HTTP", "HTTPS", "ID", "JSON", "MIT",
    "MSRV", "OS", "RAM", "ROM", "SHA", "SPDX", "TOML", "URL", "UTC", "UTF", "YAML",
    # Plain capitalized words and document names, not abbreviations.
    "CHANGELOG", "FIXME", "LICENSE", "MAY", "MUST", "NOT", "NOTE", "README", "SAFETY", "SHOULD", "TODO",
]

name: mutation
on:
  schedule:
    # This repository's own weekday, tried at 08, 10 and 12 UTC. Print the line with
    # `python3 helpers/mutation_plan.py schedule <repository name>` in the template checkout.
    - cron: '@MUTATION_CRON@'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mutation-first_crate:
    uses: nifeos/crate-workflows/.github/workflows/mutation.yml@PINS@
    with:
      manifest-path: first_crate/Cargo.toml
  mutation-second_crate:
    uses: nifeos/crate-workflows/.github/workflows/mutation.yml@PINS@
    with:
      manifest-path: second_crate/Cargo.toml

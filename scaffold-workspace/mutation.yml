name: mutation
on:
  schedule:
    # This repository's own weekday, tried at 08, 10 and 12 UTC. Print the line with
    # `python3 helpers/mutation_plan.py schedule <repository name>` in the template checkout.
    - cron: '@MUTATION_CRON@'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mutation-first_crate:
    # issues: write lets a red run file the crate's issue and a green one close it; without it the
    # run still runs and the filing ends in a warning.
    permissions:
      contents: read
      issues: write
    uses: partsfoundry/crate-workflows/.github/workflows/mutation.yml@PINS@
    with:
      manifest-path: first_crate/Cargo.toml
  mutation-second_crate:
    # issues: write lets a red run file the crate's issue and a green one close it; without it the
    # run still runs and the filing ends in a warning.
    permissions:
      contents: read
      issues: write
    uses: partsfoundry/crate-workflows/.github/workflows/mutation.yml@PINS@
    with:
      manifest-path: second_crate/Cargo.toml
